name: destroy

on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Saisie de confirmation voulue, elle ne modifie pas ce qui est déployé
    inputs:
      confirm:
        description: 'Tape "destroy" pour tout supprimer'
        required: true

concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read # lecture de l'artifact de state

env:
  AWS_REGION: eu-north-1

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_EKS }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Récupération du state (artifact chiffré)
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
        run: ./scripts/tfstate.sh pull

      - name: Terraform destroy
        id: destroy
        working-directory: terraform_infra
        run: |
          terraform init -input=false
          # Noté avant le destroy : sert ensuite à retrouver les volumes du cluster
          echo "cluster_name=$(terraform output -raw cluster_name 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          terraform destroy -input=false -auto-approve

      # State vidé (ou partiel si le destroy échoue) : le prochain deploy repart de là
      - name: Chiffrement du state
        if: always() && steps.pull.outcome == 'success' && hashFiles('terraform_infra/terraform.tfstate') != ''
        env:
          TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
        run: ./scripts/tfstate.sh encrypt

      - name: Sauvegarde du state
        if: always() && steps.pull.outcome == 'success' && hashFiles('terraform_infra/terraform.tfstate') != ''
        uses: actions/upload-artifact@v7
        with:
          name: tfstate
          path: ${{ runner.temp }}/tfstate/terraform.tfstate.enc
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      # Les disques des PVC (openbao, prosody) sont créés par Kubernetes, pas par
      # Terraform : ils survivent au cluster et restent facturés
      - name: Suppression des volumes EBS orphelins
        if: steps.destroy.outputs.cluster_name != ''
        env:
          CLUSTER_NAME: ${{ steps.destroy.outputs.cluster_name }}
        run: |
          ids=$(aws ec2 describe-volumes \
            --filters "Name=tag:ebs.csi.aws.com/cluster-name,Values=$CLUSTER_NAME" \
            --query 'Volumes[].VolumeId' --output text)
          for id in $ids; do
            # Un disque peut finir de se détacher juste après la fin du destroy
            aws ec2 wait volume-available --volume-ids "$id"
            echo "suppression de $id"
            aws ec2 delete-volume --volume-id "$id"
          done
