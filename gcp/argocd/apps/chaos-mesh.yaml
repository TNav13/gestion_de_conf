apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
spec:
  project: default
  source:
    chart: chaos-mesh
    repoURL: https://charts.chaos-mesh.org
    targetRevision: 2.8.8
    helm:
      parameters:
        - name: chaosDaemon.runtime
          value: containerd
        - name: chaosDaemon.socketPath
          value: /run/containerd/containerd.sock
        - name: dashboard.securityMode
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
  # Le chart tire des certificats et une annotation au hasard à chaque rendu : on garde ceux du cluster
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: chaos-controller-manager
      jsonPointers:
        - /spec/template/metadata/annotations/rollme
    - group: apps
      kind: DaemonSet
      name: chaos-daemon
      jsonPointers:
        - /spec/template/metadata/annotations/rollme
    - kind: Secret
      name: chaos-mesh-webhook-certs
      jsonPointers: [/data]
    - kind: Secret
      name: chaos-mesh-daemon-certs
      jsonPointers: [/data]
    - kind: Secret
      name: chaos-mesh-daemon-client-certs
      jsonPointers: [/data]
    - kind: Secret
      name: chaos-mesh-chaosd-client-certs
      jsonPointers: [/data]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: chaos-mesh-mutation
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
