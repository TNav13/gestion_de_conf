apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  # Config d'ESO (SecretStore + ExternalSecrets), séparée de l'app eso
  # qui installe les types SecretStore/ExternalSecret dont ces fichiers ont besoin
  source:
    repoURL: 'https://github.com/TNav13/gestion_de_conf.git'
    targetRevision: main
    path: helm/eso
  destination:
    server: https://kubernetes.default.svc
    namespace: jitsi
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Ne pas échouer à la vérification si les types d'ESO ne sont pas encore installés
      - SkipDryRunOnMissingResource=true
    # Un sync automatique raté n'est pas retenté sur le même commit sans retry :
    # on réessaie le temps qu'ESO soit installé
    retry:
      limit: -1 # sans limite : ESO doit aussi préparer ses webhooks avant d'accepter ces fichiers
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    automated:
      prune: true
      selfHeal: true
