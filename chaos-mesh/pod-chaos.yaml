kind: PodChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: jitsi
  name: pod-unavailable
spec:
  selector:
    namespaces:
      - jitsi
    # Une seule valeur par clé : labelSelectors est un ET, un pod n'est pas web et jvb à la fois
    labelSelectors:
      app.kubernetes.io/component: jvb
  mode: all
  action: pod-failure
  duration: 30s