enableAuth: false
enableGuests: false
prosody:
  persistence:
    enabled: true
    storageClassName: gp2
  
web:
  service:
    type: NodePort
    nodePort: 30080
  extraEnvs:
    ENABLE_P2P: "false"

jvb:
  disableStun: true
  UDPPort: 30300
  nodePort: 30300
  service:
    type: NodePort
    externalTrafficPolicy: Local
    extraPorts:
      - name: http-healthcheck
        port: 8080
        protocol: TCP
        nodePort: 30808
  xmpp:
    existingSecretName: jitsi-jvb-bao
jicofo:
  xmpp:
    existingSecretName: jitsi-jicofo-bao
  
