apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jicofo
  namespace: jitsi
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: secret-store
    kind: SecretStore
  target:
    name: jitsi-jicofo-bao
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: jicofo
---
